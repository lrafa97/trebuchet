# Exemplo de perfil: copia a pasta para ~/trebuchet_data/profiles/<id>/ e preenche com
# valores que tenhas confirmado na TUA board. Nada aqui é uma recomendação.
name = "EXEMPLO - substituir pelo nome da board"
mcu = "stm32xxxx (o que confirmaste)"
family = "stm32"                    # stm32 | rp2040 | other
interface = "can"                   # usb | can | usb-can-bridge | uart
first_katapult_method = "dfu"       # dfu | bootsel | stm32flash | stlink | deployer | other
can_bitrate = 1000000               # só para can e usb-can-bridge
# uart_baud = 250000                # só para uart
dfu_heater_warning = true           # false para desligar o aviso desta board
notes = "ficheiros klipper.config e katapult.config ao lado deste, os que já funcionam"
