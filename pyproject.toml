[project]
name = "trebuchet"
version = "0.1.0"
description = "Klipper Flash Helper: construir e gravar Klipper/Katapult em boards stm32 e rp2040"
requires-python = ">=3.11"
# Sem dependências pip: o Trebuchet só usa a biblioteca padrão. O pyserial que o flashtool.py
# do Katapult precisa vem do apt (python3-serial); no Raspberry Pi OS Bookworm o pip
# recusa instalar no Python do sistema (PEP 668).
dependencies = []

[project.scripts]
treb = "trebuchet.__main__:main"
trebuchet = "trebuchet.__main__:main"

[tool.setuptools]
packages = ["trebuchet"]
